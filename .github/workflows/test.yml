name: Verify plugin
on:
  push:
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth
      - name: Compile and test
        run: xvfb-run -a bash ./gradlew test -PrequireDisplay --console=plain
      - name: Retain test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
