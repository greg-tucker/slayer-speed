plugins {
	id 'java'
}

// Keep watcher compilation separate from tests and game-client builds.
if (project.hasProperty('previewBuild')) {
    layout.buildDirectory.set(file('build/preview-harness'))
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.slayerspeed.SlayerSpeedPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.slayerspeed'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.named('test') {
    // CI must fail if its virtual display is unavailable instead of skipping window tests.
    systemProperty 'slayerspeed.requireDisplay', project.hasProperty('requireDisplay')
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs '-ea'
	args '--developer-mode', '--debug'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}


// Standalone real-component previews. These do not start RuneLite or read account data.
tasks.register('previewUi', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slayerspeed.ui.SlayerSpeedPreview'
    group = 'verification'
    description = 'Open the interactive sidebar and overlay preview with synthetic data'
}

tasks.register('renderUi', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slayerspeed.ui.SlayerSpeedPreview'
    args '--render'
    jvmArgs '-Djava.awt.headless=true'
    group = 'verification'
    description = 'Render all synthetic UI scenarios into build/ux-preview'
}

// The watch launcher uses this classpath to restart only the preview JVM after compilation.
tasks.register('writePreviewRuntime') {
    dependsOn testClasses
    doLast {
        def binary = new File(System.getProperty('java.home'), 'bin/javaw.exe')
        if (!binary.exists()) { binary = new File(System.getProperty('java.home'), 'bin/java') }
        def output = layout.buildDirectory.file('ui-preview-runtime.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.toJson([
            java: binary.absolutePath,
            classpath: sourceSets.test.runtimeClasspath.asPath,
            main: 'com.slayerspeed.ui.SlayerSpeedPreview'
        ])
    }
}
